name: HITList
options:
  bundleIdPrefix: com.trammells
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: UC8N98H3RT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  HITListCore:
    path: HITListCore
targets:
  HITList:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HITList
    scheme:
      testTargets: [HITListTests]
    dependencies:
      - package: HITListCore
      # Linked explicitly on purpose: on macOS 26 the App Sandbox only grants cloudd access when
      # CloudKit.framework is linked, and SwiftData alone loads it lazily (Apple forums 835400).
      - sdk: CloudKit.framework
    entitlements:
      path: HITList/HITList.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.trammells.hitlist]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.developer.icloud-container-environment: Development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # iOS form. macOS uses the team-prefixed UC8N98H3RT.com.trammells.hitlist in HITList-macOS.entitlements
        # (see AppGroup.swift for why).
        com.apple.security.application-groups: [group.com.trammells.hitlist]
    info:
      path: HITList/Info.plist
      properties:
        CFBundleDisplayName: HITList
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.productivity
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        NSHumanReadableCopyright: ""
        # Shows Documents (the daily JSON backups, see LocalBackup.swift) in the iOS Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trammells.hitlist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": HITList/HITList-macOS.entitlements
        PRODUCT_NAME: HITList
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "0.1.0"
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  HITListTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HITListTests
    dependencies:
      - target: HITList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trammells.hitlist.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HITList.app/HITList"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/HITList.app/Contents/MacOS/HITList"
        BUNDLE_LOADER: "$(TEST_HOST)"
