name: HITList
options:
  bundleIdPrefix: com.trammells
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: UC8N98H3RT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # The version and build of everything in the app: the app, its widget extension (whose version must equal the
    # app's) and the helpers inherit these. scripts/release.sh reads and bumps exactly one line of each, so no target
    # sets its own.
    CURRENT_PROJECT_VERSION: 24
    MARKETING_VERSION: "0.9.3"
packages:
  HITListCore:
    path: HITListCore
targets:
  HITList:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HITList
        excludes:
          # Markdown under HITList/ (e.g. Support/DesignSystem/README.md) is documentation, not a resource.
          - "**/*.md"
          # Fonts: the repo holds only the six Inter 18 pt static cuts that ship (Light, Regular, Medium,
          # SemiBold, Bold, ExtraBold; see HITFont in HITTokens.swift) and Inter's licence. iOS resolves a
          # variable font's named weights only for the default instance, so the static cuts are what both
          # platforms load by PostScript name. The variable files, the other cuts and Noto Sans, never in the
          # bundle, left the repo in 0.7.0 (git history has them: fonts.google.com/specimen/Inter).
          - "**/.DS_Store"
      # The widgets' views (brief 74) are compiled into the app too, so the hosted tests render every widget
      # offscreen at its exact size (`HITListTests/Widget*Tests.swift`). The extension's own files stay out.
      - path: HITListWidgets/Views
      # The share sheet's card and its model (brief 90), compiled into the app too so the hosted tests draw the card in
      # every phase (`ShareCardRenderTests`). The extension's own host, reader and view controllers stay out.
      - HITListShare/ShareCard.swift
      - HITListShare/ShareSheetModel.swift
      - HITListShare/ShareStore.swift
    scheme:
      testTargets: [HITListTests]
    dependencies:
      - package: HITListCore
      # The widgets (brief 74): HITList.app/PlugIns/HITListWidgets.appex (Contents/PlugIns on the Mac).
      - target: HITListWidgets
      # "Add to HITList" from the share sheet (brief 90): HITList.app/PlugIns/HITListShare.appex (Contents/PlugIns on the Mac).
      - target: HITListShare
      # Linked explicitly on purpose: on macOS 26 the App Sandbox only grants cloudd access when
      # CloudKit.framework is linked, and SwiftData alone loads it lazily (Apple forums 835400).
      - sdk: CloudKit.framework
      # The Claude connector's MCP helper (brief 43), Mac only: HITList.app/Contents/MacOS/hitlist-mcp.
      - target: hitlist-mcp
        destinationFilters: [macOS]
        copy:
          destination: executables
    entitlements:
      path: HITList/HITList.entitlements
      properties:
        # The second container holds Shared Tasks (brief 51), apart from the task store's. Keep the task store's first.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.trammells.hitlist, iCloud.com.trammells.hitlist.shared]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.developer.icloud-container-environment: Development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # iOS form. macOS uses the team-prefixed UC8N98H3RT.com.trammells.hitlist in HITList-macOS.entitlements
        # (see AppGroup.swift for why).
        com.apple.security.application-groups: [group.com.trammells.hitlist]
        # The sky for the companions (briefs 80, 83): Apple's weather, on unless switched off in Settings → Extras,
        # and silent until the location question has been answered.
        com.apple.developer.weatherkit: true
    info:
      path: HITList/Info.plist
      properties:
        CFBundleDisplayName: HITList
        CFBundleShortVersionString: "0.9.3"
        CFBundleVersion: "24"
        LSApplicationCategoryType: public.app-category.productivity
        # Brief 81: fetch for the widgets' background refresh (WidgetRefresh), beside the silent pushes.
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.trammells.hitlist.widget-refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        NSHumanReadableCopyright: ""
        # Shows Documents (the daily JSON backups, see LocalBackup.swift) in the iOS Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Shared Tasks (brief 51): lets a CloudKit share link open in HITList and reach the share-acceptance callbacks.
        CKSharingSupported: true
        # Calendar events beside the tasks (brief 77), off until switched on in Settings → General. Read-only.
        NSCalendarsFullAccessUsageDescription: "HITList shows your calendar events beside your tasks in Today and Upcoming. It only reads them: it never adds, changes or deletes an event, and they stay on this device."
        # The companion's local time and sky (briefs 80, 83): asked once at the first launch, on unless switched off in
        # Settings → Extras → Weather. While in use, and approximate only: the prompt offers no precise location.
        NSLocationWhenInUseUsageDescription: "HITList uses your approximate location to keep your companion on local time and dressed for the weather where you are. It is never stored or shared."
        NSLocationDefaultAccuracyReduced: true
        # The widgets' links into the app (brief 74, Services/DeepLinks): hitlist://task/<id>, hitlist://today,
        # hitlist://upcoming, hitlist://flipboard.
        CFBundleURLTypes:
          - CFBundleURLName: com.trammells.hitlist
            CFBundleURLSchemes: [hitlist]
        # Debug only (brief 81, WidgetDebug): the side store a build made with HITLIST_WIDGET_SUFFIX=<name> opens when the
        # system launches it for a widget's tap, as its extension reads that store's snapshot. Release ignores it.
        HITListWidgetSuffix: $(HITLIST_WIDGET_SUFFIX)
        # ProMotion iPhones may run animations above 60 Hz (the sync bolt's strike, brief 54); without this key
        # Core Animation caps them at 60 on iPhone.
        CADisableMinimumFrameDurationOnPhone: true
        # Inter is the app typeface; resources are flattened into the bundle root. Keep in step with `includes`.
        UIAppFonts: [Inter_18pt-Light.ttf, Inter_18pt-Regular.ttf, Inter_18pt-Medium.ttf, Inter_18pt-SemiBold.ttf, Inter_18pt-Bold.ttf, Inter_18pt-ExtraBold.ttf]
        ATSApplicationFontsPath: "."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trammells.hitlist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": HITList/HITList-macOS.entitlements
        PRODUCT_NAME: HITList
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        # The iPad build must not run on a Mac. TestFlight and the App Store offer "iPhone and iPad apps" to Apple
        # silicon Macs unless the build opts out, and the first friend to test on a Mac installed that one: the iPad
        # layout in a plain Mac window (grey title bar, cramped sidebar), not the Mac app uploaded beside it
        # (2026-11-06). This target's macOS destination is the Mac app. The same for Vision Pro.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Brief 81: empty unless a Debug build names a side store (see HITListWidgetSuffix above and the extension's).
        HITLIST_WIDGET_SUFFIX: ""
  # The widgets (brief 74): Today, Upcoming and Flipboard on the Home Screen, the Mac's desktop and Notification
  # Centre, and the iPhone's Lock Screen. The extension never opens the store (it mirrors to CloudKit; a second
  # process must not touch it): the app writes a JSON snapshot of its open tasks into the App Group container
  # (`Services/Widgets/`) and the extension reads that file and nothing else, asking HITListCore's rules
  # (`WidgetContent`) what each widget shows at each moment. The design system's files are compiled in, not copied.
  # Its version is the app's: it inherits the project-level MARKETING_VERSION and CURRENT_PROJECT_VERSION through
  # $(…) in its Info.plist, and sets none of its own.
  HITListWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HITListWidgets
        excludes:
          - "*.entitlements"
          - "Info.plist"
          - "**/.DS_Store"
      # Shared with the app, compiled into both (never copied): the palettes, Inter and the type roles, the due and
      # priority colours, the calendar's grid arithmetic, and the deep links.
      - HITList/Support/Theme.swift
      - HITList/Support/Preferences.swift
      - HITList/Support/Formatting.swift
      - HITList/Support/DesignSystem/HITTokens.swift
      - HITList/Support/DesignSystem/HITCalendar.swift
      - HITList/Support/DesignSystem/HITButtonStyle.swift
      - HITList/Services/DeepLinks/DeepLink.swift
      # Brief 81: a row's check and a red pill's flip. The intent is the same type in both targets, so the system can
      # run it in the app (iPhone, iPad) or here (the Mac); each target has its own WidgetIntentRoad.
      - HITList/Services/Intents/WidgetCompletionIntent.swift
      # The six Inter cuts the app ships, registered by the extension's own Info.plist.
      - path: HITList/Resources/Fonts/Inter/static
        buildPhase: resources
      # The app's privacy manifest: the extension reads its own UserDefaults (the compiled-in ThemeStore), a
      # required-reason API, and App Store Connect looks for a manifest in each bundle.
      - path: HITList/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HITListCore
    entitlements:
      # iOS form. macOS uses the team-prefixed group in HITListWidgets-macOS.entitlements, as the app does (see
      # AppGroup.swift for why). Sandboxed on both; no network, no iCloud: the snapshot file is all it reads.
      path: HITListWidgets/HITListWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.com.trammells.hitlist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trammells.hitlist.widgets
        PRODUCT_NAME: HITListWidgets
        INFOPLIST_FILE: HITListWidgets/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": HITListWidgets/HITListWidgets-macOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        SKIP_INSTALL: YES
        # The group the extension reads, in its Info.plist (`HITListAppGroup`); WidgetAppGroupTests checks it equals
        # the app's `AppGroup.id` on each platform.
        HITLIST_APP_GROUP: group.com.trammells.hitlist
        "HITLIST_APP_GROUP[sdk=macosx*]": UC8N98H3RT.com.trammells.hitlist
        # Debug only: a build made with HITLIST_WIDGET_SUFFIX=<name> reads that side store's snapshot
        # (HITLIST_STORE_SUFFIX=<name>), so a session sees its own demo week in real widgets. Release ignores it.
        HITLIST_WIDGET_SUFFIX: ""
  # "Add to HITList" from any app's share sheet (brief 90): a web page (its address and title), a link, selected or
  # plain text; one item, never images or files (the activation rule in its Info.plist). Like the widgets it never
  # opens the store (it mirrors to CloudKit; a second process must not touch it): Add writes a request into the App
  # Group's share outbox (HITListCore's ShareOutbox) and rings the app, which makes the task by quick add's road
  # (`Services/Share/ShareInbox`). It reads only the context the app writes beside it (theme, week start, Groups and
  # labels by name). Sandboxed on both platforms, no network, no iCloud. The design system's files are compiled in, not
  # copied. Its version is the app's, through $(…) in its Info.plist; it sets none of its own.
  HITListShare:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HITListShare
        excludes:
          - "*.entitlements"
          - "Info.plist"
          - "*.js"
          - "**/.DS_Store"
      # Safari on iPhone and iPad runs it on the page to hand over its address, title and selected text.
      - path: HITListShare/ShareJavaScript.js
        buildPhase: resources
      # Shared with the app, compiled into both (never copied): the palettes, Inter and the type roles, the due and
      # priority colours, the buttons and the field, and the share road (outbox, ledger, bell).
      - HITList/Support/Theme.swift
      - HITList/Support/Preferences.swift
      - HITList/Support/Formatting.swift
      - HITList/Support/DesignSystem/HITTokens.swift
      - HITList/Support/DesignSystem/HITButtonStyle.swift
      - HITList/Support/DesignSystem/HITField.swift
      - HITList/Services/Share/ShareBell.swift
      - path: HITList/Resources/Fonts/Inter/static
        buildPhase: resources
      # The app's privacy manifest: the extension reads its own UserDefaults (the compiled-in ThemeStore), a
      # required-reason API, and App Store Connect looks for a manifest in each bundle.
      - path: HITList/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HITListCore
    entitlements:
      # iOS form. macOS uses the team-prefixed group in HITListShare-macOS.entitlements, as the app and the widgets do
      # (see AppGroup.swift for why). The outbox, the ledger and the context are all it touches.
      path: HITListShare/HITListShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.com.trammells.hitlist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trammells.hitlist.share
        PRODUCT_NAME: HITListShare
        INFOPLIST_FILE: HITListShare/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": HITListShare/HITListShare-macOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        SKIP_INSTALL: YES
        # The group it writes into, in its Info.plist (`HITListAppGroup`); ShareExtensionTests checks it equals the
        # app's `AppGroup.id` on each platform.
        HITLIST_APP_GROUP: group.com.trammells.hitlist
        "HITLIST_APP_GROUP[sdk=macosx*]": UC8N98H3RT.com.trammells.hitlist
        # Debug only, as the widgets': a build made with HITLIST_WIDGET_SUFFIX=<name> writes into that side store's outbox
        # (HITLIST_STORE_SUFFIX=<name>). A Debug build without one writes the Development store's, as a Debug app opens it.
        # Release ignores it and writes the real store's.
        HITLIST_WIDGET_SUFFIX: ""
  # The Claude connector's MCP server (brief 43): a sandboxed command-line tool that Claude Desktop and
  # Claude Code start over stdio. It holds only the app group and talks to the running app through the
  # group's message port (ClaudeWire); it never opens the store. No version keys here: release.sh reads
  # MARKETING_VERSION and CURRENT_PROJECT_VERSION expecting one line each; the helper reports the app's.
  hitlist-mcp:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: HITListMCP
        excludes:
          - "*.entitlements"
    dependencies:
      - package: HITListCore
    settings:
      base:
        PRODUCT_NAME: hitlist-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.trammells.hitlist.mcp
        CODE_SIGN_ENTITLEMENTS: HITListMCP/hitlist-mcp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # A sandboxed tool needs an Info.plist (its bundle id names its container); it lives in the binary.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # Installed inside HITList.app, never on its own (an archive with a loose tool isn't an app archive).
        SKIP_INSTALL: YES
        DEAD_CODE_STRIPPING: YES
  HITListTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HITListTests
    dependencies:
      - target: HITList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trammells.hitlist.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HITList.app/HITList"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/HITList.app/Contents/MacOS/HITList"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # UI tests on the iPhone simulator (supervisor, round 11): XCUITest taps and types through the real app, so a
  # session can check a screen without the simulator panel's permission. Their own scheme, so `scripts/test.sh`
  # runs them only when asked (`scripts/test.sh ui`) and releases never build them. No version keys here:
  # release.sh expects exactly one CURRENT_PROJECT_VERSION line.
  HITListUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: HITListUITests
    dependencies:
      - target: HITList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trammells.hitlist.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HITList
schemes:
  HITListUITests:
    build:
      targets:
        HITList: all
        HITListUITests: [test]
    test:
      targets: [HITListUITests]
