name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26 (arm64) is the newest GA image with Xcode 26.x; see actions/runner-images.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          # scripts/test.sh defaults DEVELOPER_DIR to /Applications/Xcode.app; pin it to the selection.
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            HITListCore/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('HITListCore/Package.swift', 'HITListCore/Package.resolved', 'HITListCore/Sources/**', 'HITListCore/Tests/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: HITListCore tests
        run: swift test --package-path HITListCore

      # Unsigned: the tests use the in-memory store and HITListApp.init's XCTest guard, so no CloudKit
      # entitlement or provisioning profile is needed.
      - name: App tests (macOS, unsigned)
        env:
          HITLIST_TEST_LOGS: ${{ runner.temp }}/hitlist-tests
        run: scripts/test.sh --unsigned macos

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ${{ runner.temp }}/hitlist-tests
          if-no-files-found: ignore
